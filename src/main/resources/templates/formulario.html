<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: cabecera('Nuevo')}"></head>
<body>
  <nav th:replace="~{fragments :: navbar}"></nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow">
          <div class="card-header bg-primary text-white" th:text="${post.id == null} ? 'Crear Post' : 'Editar Post'">Crear Post</div>
          <div class="card-body">
            <form th:action="@{/guardar}" th:object="${post}" method="post">
              <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" th:field="*{title}"
                       th:classappend="${#fields.hasErrors('title')}? 'is-invalid'"
                       placeholder="Escribe un título llamativo">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Error en el título</div>
              </div>

              <div class="mb-3">
                <label for="contenido" class="form-label">Contenido</label>
                <textarea class="form-control" rows="6"
                          th:field="*{content}"
                          th:classappend="${#fields.hasErrors('content')}? 'is-invalid'"
                          id="contenido"
                          placeholder="¿Qué tienes en mente?"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">Error en el contenido</div>
              </div>

              <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success" th:text="${post.id == null} ? 'Publicar Post' : 'Guardar cambios'">Publicar Post</button>
              </div>
              <!-- Campo oculto para pasar el ID -->
              <input type="hidden" th:field="*{id}">
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
